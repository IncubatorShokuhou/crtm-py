[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crtm-py"
version = "0.1.0"
description = "Pure-Python CRTM forward path for UPP v4.1 WRF-ARW ABI brightness temperature"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "crtm-py contributors" }]
keywords = ["crtm", "radiative-transfer", "brightness-temperature", "goes-abi", "upp"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
docs = [
  "sphinx>=7",
  "pydata-sphinx-theme>=0.15",
  "numpydoc>=1.6",
  "sphinx-copybutton>=0.5",
]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/IncubatorShokuhou/crtm-py"
Repository = "https://github.com/IncubatorShokuhou/crtm-py"

[project.scripts]
crtm-py = "crtm_py.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
