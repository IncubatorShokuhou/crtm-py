name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,docs]"
      - name: Test
        run: pytest
      - name: Docs
        if: matrix.python-version == '3.12'
        run: sphinx-build -W -b html docs docs/_build/html

  crtm-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Cache extracted ABI coefficients
        id: coeff-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/crtm-coeff
          key: crtm-jedi-2.4.0-abi-g16-v1
      - name: Download and extract coefficients
        if: steps.coeff-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/crtm-coeff"
          mkdir -p "$dest"
          curl -L --fail --retry 3 -o "$dest/jedi.tar" \
            https://bin.ssec.wisc.edu/pub/s4/CRTM/file/crtm_coefficients_jedi_release_2.4.0.tar.gz
          tar -xf "$dest/jedi.tar" -C "$dest" \
            --wildcards \
            '*/SpcCoeff/Little_Endian/abi_g16.SpcCoeff.bin' \
            '*/TauCoeff/ODPS/Little_Endian/abi_g16.TauCoeff.bin' \
            '*/CloudCoeff/Little_Endian/CloudCoeff.bin' \
            '*/IR_Water/Little_Endian/Nalli.IRwater.EmisCoeff.bin' \
            '*/IR_Land/SEcategory/Little_Endian/NPOESS.IRland.EmisCoeff.bin' \
            '*/IR_Land/SEcategory/Big_Endian/NPOESS.IRland.EmisCoeff.bin'
          rm -f "$dest/jedi.tar"
      - name: Compare with recorded CRTM v2.4 brightness temperatures
        env:
          CRTM_PY_COEFF_DIR: ${{ runner.temp }}/crtm-coeff
        run: pytest tests/test_crtm_reference.py
